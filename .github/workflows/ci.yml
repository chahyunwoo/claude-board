name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 같은 브랜치에서 새 푸시가 오면 진행 중인 실행을 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 어떤 영역이 바뀌었는지 판단한다.
  # 프론트는 아직 없다 — 생기면 자동으로 아래 잡들이 돈다.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'src/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle/**'
              - 'gradlew'
            frontend:
              - 'frontend/**'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 준비
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Gradle 준비
        uses: gradle/actions/setup-gradle@v4

      - name: 빌드·테스트
        run: ./gradlew build --no-daemon
        # 벤치마크(ReaderBenchmark)는 이 기계의 실제 세션 기록을 읽으므로
        # -Dbenchmark 를 주지 않는다. CI 에는 그 데이터가 없다.

      - name: 테스트 리포트 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: build/reports/tests/test
          retention-days: 7

      - name: 배포 산출물에 세션 데이터가 섞이지 않았는가
        run: |
          # 세션 기록에는 프롬프트 전문·절대 경로·브랜치명이 들어 있다.
          # jar 에 섞여 공개되면 되돌릴 수 없다. docs/04-배포.md
          if unzip -l build/libs/claude-board.jar | grep -iE '\.jsonl|\.log'; then
            echo "::error::jar 에 세션 데이터가 섞였습니다"
            exit 1
          fi
          echo "세션 데이터 없음 ✓"

      - name: 바인딩이 127.0.0.1 인가
        run: |
          # 0.0.0.0 으로 새면 세션 기록이 네트워크에 노출된다.
          # docs/00-개요.md "데이터는 기계를 떠나지 않는다"
          if grep -rnE 'address:\s*0\.0\.0\.0' src/main/resources/; then
            echo "::error::0.0.0.0 바인딩이 발견되었습니다"
            exit 1
          fi
          grep -q 'address: 127.0.0.1' src/main/resources/application.yml \
            || { echo "::error::127.0.0.1 바인딩 설정이 없습니다"; exit 1; }
          echo "127.0.0.1 바인딩 확인 ✓"

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: 타입 체크
        run: npm run type-check --if-present

      - name: 린트
        run: npm run lint --if-present

      - name: 단위 테스트
        run: npm run test:unit --if-present

      - name: 빌드
        run: npm run build

  e2e:
    needs: [changes, frontend]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 준비
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 프론트 의존성
        run: npm ci
        working-directory: frontend

      - name: Playwright 브라우저
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: E2E
        run: npm run test:e2e
        working-directory: frontend

      - name: 실패 시 리포트 보관
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: frontend/playwright-report
          retention-days: 7

  # 브랜치 보호가 요구할 단일 게이트.
  # 개별 잡은 변경 영역에 따라 건너뛸 수 있으므로 여기서 한 번에 판정한다.
  # 스킵은 통과로 보되, 실패·취소는 통과시키지 않는다.
  ci:
    needs: [backend, frontend, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 결과 판정
        run: |
          echo "backend : ${{ needs.backend.result }}"
          echo "frontend: ${{ needs.frontend.result }}"
          echo "e2e     : ${{ needs.e2e.result }}"
          for r in "${{ needs.backend.result }}" \
                   "${{ needs.frontend.result }}" \
                   "${{ needs.e2e.result }}"; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::실패한 잡이 있습니다"; exit 1 ;;
            esac
          done
          echo "전부 통과 ✓"

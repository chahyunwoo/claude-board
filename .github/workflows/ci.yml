name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 같은 브랜치에서 새 푸시가 오면 진행 중인 실행을 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 어떤 영역이 바뀌었는지 판단한다. 바뀐 영역의 잡만 돈다.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      hooks: ${{ steps.filter.outputs.hooks }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # 워크플로 자체가 바뀌면 **모든 잡을 돌린다** (#25).
          #
          # 실측: 액션 버전을 올리는 PR 에서 backend·frontend·e2e 가 전부 스킵되어
          # **갱신한 액션 6개 중 4개가 한 번도 실행되지 않은 채 CI 가 초록이었다.**
          # setup-java·setup-node·upload-artifact·setup-gradle 이 그것들이다 —
          # 그대로 머지했다면 다음 PR 에서 터졌을 것이다.
          #
          # CI 를 고치는 변경이 CI 로 검증되지 않는 구멍이었다.
          filters: |
            backend:
              - 'src/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle/**'
              - 'gradlew'
              - '.github/workflows/**'
            frontend:
              - 'frontend/**'
              - '.github/workflows/**'
            hooks:
              - '.githooks/**'
              - '.github/workflows/**'

  # 훅이 **실제로 작동하는지** 검사한다.
  #
  # 실측(#13): 훅이 설정돼 있고 실행권한도 있는데 한글 파일명을 전혀 검사하지 못해,
  # 문서에 잔재를 넣어도 여섯 번 다 통과했다 — 예외도 에러도 없이 조용히.
  # "훅이 존재한다"와 "훅이 잡는다" 사이의 간격은 사람이 기억해서 메울 수 없다.
  hooks:
    needs: changes
    if: needs.changes.outputs.hooks == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 훅이 잔재를 실제로 잡는가
        run: |
          git config core.hooksPath .githooks
          git config user.email ci@example.com
          git config user.name CI

          fail=0

          # 세 형태 × 한글·영문 파일명. 한글 쪽이 이번에 죽어 있던 경로다.
          for word in MUTATION MUTATED MUTANT; do
            for f in "src/한글테스트.java" "src/asciitest.java"; do
              printf '// %s\n' "$word" > "$f"
              git add -A
              if sh .githooks/pre-commit >/dev/null 2>&1; then
                echo "::error::$word 를 $f 에서 잡지 못했습니다"
                fail=1
              else
                echo "  ✓ $word in $f — 거부됨"
              fi
              rm -f "$f"
            done
          done

          # 위양성: MutationObserver 는 정당한 브라우저 API 다(패턴이 대문자라 안 걸려야 한다).
          printf 'const o = new MutationObserver(() => {})\n' > src/fptest.ts
          git add -A
          if sh .githooks/pre-commit >/dev/null 2>&1; then
            echo "  ✓ MutationObserver — 위양성 없음"
          else
            echo "::error::정당한 코드(MutationObserver)를 거부합니다"
            fail=1
          fi
          rm -f src/fptest.ts
          git add -A

          # 깨끗할 때는 통과해야 한다 — 무조건 거부하는 훅은 훅이 아니라 벽이다.
          # **임시 파일을 다 치운 뒤에** 봐야 의미가 있다.
          if sh .githooks/pre-commit >/dev/null 2>&1; then
            echo "  ✓ 깨끗한 상태 — 통과"
          else
            echo "::error::잔재가 없는데도 커밋을 거부합니다"
            sh .githooks/pre-commit || true
            fail=1
          fi

          exit $fail

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: JDK 21 준비
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin

      - name: Gradle 준비
        uses: gradle/actions/setup-gradle@v6

      - name: 빌드·테스트
        run: ./gradlew build --no-daemon
        # 벤치마크(ReaderBenchmark)는 이 기계의 실제 세션 기록을 읽으므로
        # -Dbenchmark 를 주지 않는다. CI 에는 그 데이터가 없다.

      - name: 테스트 리포트 보관
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-report
          path: build/reports/tests/test
          retention-days: 7

      - name: 배포 산출물에 세션 데이터가 섞이지 않았는가
        run: |
          # 세션 기록에는 프롬프트 전문·절대 경로·브랜치명이 들어 있다.
          # jar 에 섞여 공개되면 되돌릴 수 없다. docs/04-배포.md
          if unzip -l build/libs/claude-board.jar | grep -iE '\.jsonl|\.log'; then
            echo "::error::jar 에 세션 데이터가 섞였습니다"
            exit 1
          fi
          echo "세션 데이터 없음 ✓"

      - name: 바인딩이 127.0.0.1 인가
        run: |
          # 0.0.0.0 으로 새면 세션 기록이 네트워크에 노출된다.
          # docs/00-개요.md "데이터는 기계를 떠나지 않는다"
          if grep -rnE 'address:\s*0\.0\.0\.0' src/main/resources/; then
            echo "::error::0.0.0.0 바인딩이 발견되었습니다"
            exit 1
          fi
          grep -q 'address: 127.0.0.1' src/main/resources/application.yml \
            || { echo "::error::127.0.0.1 바인딩 설정이 없습니다"; exit 1; }
          echo "127.0.0.1 바인딩 확인 ✓"

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: 타입 체크
        run: npm run type-check --if-present

      - name: 린트
        run: npm run lint --if-present

      - name: 단위 테스트
        run: npm run test:unit --if-present

      - name: 빌드
        run: npm run build

  e2e:
    needs: [changes, frontend]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: JDK 21 준비
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 프론트 의존성
        run: npm ci
        working-directory: frontend

      - name: Playwright 브라우저
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: E2E
        run: npm run test:e2e
        working-directory: frontend

      - name: 실패 시 리포트 보관
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: frontend/playwright-report
          retention-days: 7

  # 브랜치 보호가 요구할 단일 게이트.
  # 개별 잡은 변경 영역에 따라 건너뛸 수 있으므로 여기서 한 번에 판정한다.
  # 스킵은 통과로 보되, 실패·취소는 통과시키지 않는다.
  ci:
    needs: [backend, frontend, e2e, hooks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 결과 판정
        run: |
          echo "backend : ${{ needs.backend.result }}"
          echo "frontend: ${{ needs.frontend.result }}"
          echo "e2e     : ${{ needs.e2e.result }}"
          echo "hooks   : ${{ needs.hooks.result }}"
          for r in "${{ needs.backend.result }}" \
                   "${{ needs.frontend.result }}" \
                   "${{ needs.e2e.result }}" \
                   "${{ needs.hooks.result }}"; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::실패한 잡이 있습니다"; exit 1 ;;
            esac
          done
          echo "전부 통과 ✓"
